license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Projeto Ivalice Team"
description='''
Projeto Ivalice — Recriação modular e fiel do universo de Final Fantasy XII: The Zodiac Age no Minecraft Java (Biomas de Ivalice, Clima Sazonal, Materiais, Equipamentos, Criaturas, Combate por Turnos e Caçadas do Clã Centurio).
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="terrablender"
    type="required"
    versionRange="[26.3.0.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="optional"
    versionRange="[5.5.0,)"
    ordering="AFTER"
    side="BOTH"
